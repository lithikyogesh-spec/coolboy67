<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcy++</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator-container">
    <div class="calculator">
        <div class="header">
            <div class="title">Calcy++</div>
            <div class="controls">
                <button class="toggle-btn active" id="degRadBtn" onclick="toggleDegRad()">DEG</button>
                <button class="toggle-btn">☀️ Light</button>
            </div>
        </div>
        
        <input type="text" class="display" id="screen" value="0" readonly>
        
        <div class="grid">
            <!-- Row 1 -->
            <button onclick="inputFunc('sin')">sin</button>
            <button onclick="inputFunc('cos')">cos</button>
            <button onclick="inputFunc('tan')">tan</button>
            <button onclick="inputFunc('asin')">sin⁻¹</button>
            <button onclick="inputFunc('acos')">cos⁻¹</button>
            <button onclick="inputFunc('atan')">tan⁻¹</button>
            
            <!-- Row 2 -->
            <button onclick="inputFunc('log')">log</button>
            <button onclick="inputFunc('ln')">ln</button>
            <button onclick="input('π')">π</button>
            <button onclick="input('e')">e</button>
            <button onclick="inputFunc('sqrt')">√</button>
            <button onclick="input('^')">xʸ</button>
            
            <!-- Row 3 -->
            <button class="btn-ac" onclick="clearScreen()">AC</button>
            <button onclick="backspace()">⌫</button>
            <button onclick="input('(')">(</button>
            <button onclick="input(')')">)</button>
            <button onclick="input('%')">%</button>
            <button onclick="input('/')">÷</button>
            
            <!-- Row 4 -->
            <button class="btn-num" onclick="input('7')">7</button>
            <button class="btn-num" onclick="input('8')">8</button>
            <button class="btn-num" onclick="input('9')">9</button>
            <button onclick="input('*')">×</button>
            <button onclick="inputFunc('abs')">abs</button>
            <button onclick="input('-')">-</button>
            
            <!-- Row 5 -->
            <button class="btn-num" onclick="input('4')">4</button>
            <button class="btn-num" onclick="input('5')">5</button>
            <button class="btn-num" onclick="input('6')">6</button>
            <button onclick="input('+')">+</button>
            <button onclick="inputFunc('fact')">n!</button>
            <button class="btn-equal" onclick="calculate()">=</button>
            
            <!-- Row 6 -->
            <button class="btn-num" onclick="input('1')">1</button>
            <button class="btn-num" onclick="input('2')">2</button>
            <button class="btn-num" onclick="input('3')">3</button>
            <button class="btn-num" style="grid-column: span 2;" onclick="input('0')">0</button>
        </div>
    </div>

    <!-- History Panel Side Component -->
    <div class="history-panel">
        <div class="history-header">
            <h3>History</h3>
            <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="history-empty" id="emptyMessage">No recent equations</div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
