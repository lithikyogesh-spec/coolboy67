<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcy++ | Cyber Glass Edition</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --calc-glass: rgba(15, 23, 42, 0.65);
            --screen-bg: rgba(2, 6, 23, 0.85);
            --screen-text: #f8fafc;
            --btn-bg: rgba(255, 255, 255, 0.04);
            --btn-text: #e2e8f0;
            --btn-hover: rgba(255, 255, 255, 0.12);
            --btn-action-bg: rgba(99, 102, 241, 0.15);
            --btn-action-text: #818cf8;
            --btn-action-hover: rgba(99, 102, 241, 0.3);
            --border-color: rgba(255, 255, 255, 0.08);
            --neon-glow: 0 0 15px rgba(99, 102, 241, 0.5);
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient neon background blobs */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            filter: blur(60px);
        }
        body::before { top: 10%; left: 15%; }
        body::after { bottom: 10%; right: 15%; background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, rgba(0,0,0,0) 70%); }

        .container {
            display: flex;
            background: var(--calc-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 28px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            max-width: 950px;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        .calc-main {
            flex: 1;
            padding: 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.03em;
            background: linear-gradient(90deg, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .toggle-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .toggle-btn:hover {
            background: var(--btn-hover);
            border-color: rgba(255,255,255,0.2);
        }

        .screen {
            background: var(--screen-bg);
            color: var(--screen-text);
            padding: 28px;
            border-radius: 20px;
            text-align: right;
            margin-bottom: 28px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }

        .screen-mode {
            font-size: 0.75rem;
            color: #818cf8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .expression {
            font-size: 1.2rem;
            color: #64748b;
            min-height: 1.8rem;
            font-family: monospace;
        }

        .result {
            font-size: 2.8rem;
            font-weight: 700;
            overflow-x: auto;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }

        button {
            border: 1px solid var(--border-color);
            padding: 18px 8px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            background: var(--btn-bg);
            color: var(--btn-text);
            user-select: none;
        }

        button:hover {
            background: var(--btn-hover);
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            box-shadow: var(--neon-glow);
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-action {
            background: var(--btn-action-bg);
            color: var(--btn-action-text);
            border-color: transparent;
        }

        .btn-action:hover {
            background: var(--btn-action-hover);
        }

        .btn-equals {
            background: linear-gradient(90deg, #6366f1, #ec4899);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .btn-equals:hover {
            background: linear-gradient(90deg, #4f46e5, #db2777);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
        }

        .history-sidebar {
            width: 280px;
            border-left: 1px solid var(--border-color);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.15);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: var(--btn-text);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 420px;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: right;
            cursor: pointer;
            border-radius: 8px;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .history-expr {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .history-res {
            font-size: 1.15rem;
            font-weight: 600;
            color: #818cf8;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .grid { grid-template-columns: repeat(4, 1fr); }
            .scientific { display: none; }
            .history-sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="calc-main">
        <div class="header">
            <div class="logo">Calcy++</div>
            <div class="controls">
                <button class="toggle-btn" id="mode-toggle">DEG</button>
            </div>
        </div>

        <div class="screen">
            <div class="screen-mode" id="angle-indicator">Degrees</div>
            <div class="expression" id="expression-display"></div>
            <div class="result" id="result-display">0</div>
        </div>

        <div class="grid">
            <!-- Trigonometry Row -->
            <button class="btn-action scientific" onclick="pressFunc('sin(')">sin</button>
            <button class="btn-action scientific" onclick="pressFunc('cos(')">cos</button>
            <button class="btn-action scientific" onclick="pressFunc('tan(')">tan</button>
            <button class="btn-action scientific" onclick="pressFunc('asin(')">sin⁻¹</button>
            <button class="btn-action scientific" onclick="pressFunc('acos(')">cos⁻¹</button>
            <button class="btn-action scientific" onclick="pressFunc('atan(')">tan⁻¹</button>

            <!-- Advanced Math Row -->
            <button class="btn-action scientific" onclick="pressFunc('log(')">log</button>
            <button class="btn-action scientific" onclick="pressFunc('ln(')">ln</button>
            <button class="btn-action scientific" onclick="pressValue('π')">π</button>
            <button class="btn-action scientific" onclick="pressValue('e')">e</button>
            <button class="btn-action scientific" onclick="pressFunc('sqrt(')">√</button>
            <button class="btn-action scientific" onclick="pressValue('^')">xʸ</button>

            <!-- Core Commands -->
            <button class="btn-action" onclick="resetCalc()">AC</button>
            <button class="btn-action" onclick="dropLastChar()">⌫</button>
            <button class="btn-action" onclick="pressValue('(')">(</button>
            <button class="btn-action" onclick="pressValue(')')">)</button>
            <button class="btn-action" onclick="pressValue('%')">%</button>
            <button class="btn-action" onclick="pressValue('/')">÷</button>

            <!-- Numbers & Operators -->
            <button onclick="pressValue('7')">7</button>
            <button onclick="pressValue('8')">8</button>
            <button onclick="pressValue('9')">9</button>
            <button class="btn-action" onclick="pressValue('*')">×</button>
