<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcy++ | Advanced Scientific Calculator</title>
    <!-- Links to your external style sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="calc-main">
        <div class="header">
            <div class="logo">Calcy++</div>
            <div class="controls">
                <button class="toggle-btn" id="mode-toggle">DEG</button>
                <button class="toggle-btn" id="theme-toggle">🌓 Theme</button>
            </div>
        </div>

        <div class="screen">
            <div class="screen-mode" id="angle-indicator">Degrees</div>
            <div class="expression" id="expression-display"></div>
            <div class="result" id="result-display">0</div>
        </div>

        <div class="grid">
            <!-- Trigonometry Row -->
            <button class="btn-action scientific" onclick="inputFunc('sin(')">sin</button>
            <button class="btn-action scientific" onclick="inputFunc('cos(')">cos</button>
            <button class="btn-action scientific" onclick="inputFunc('tan(')">tan</button>
            <button class="btn-action scientific" onclick="inputFunc('asin(')">sin⁻¹</button>
            <button class="btn-action scientific" onclick="inputFunc('acos(')">cos⁻¹</button>
            <button class="btn-action scientific" onclick="inputFunc('atan(')">tan⁻¹</button>

            <!-- Advanced Math Row -->
            <button class="btn-action scientific" onclick="inputFunc('log(')">log</button>
            <button class="btn-action scientific" onclick="inputFunc('ln(')">ln</button>
            <button class="btn-action scientific" onclick="input('π')">π</button>
            <button class="btn-action scientific" onclick="input('e')">e</button>
            <button class="btn-action scientific" onclick="inputFunc('sqrt(')">√</button>
            <button class="btn-action scientific" onclick="input('^')">xʸ</button>

            <!-- Core Commands -->
            <button class="btn-action" onclick="clearAll()">AC</button>
            <button class="btn-action" onclick="backspace()">⌫</button>
            <button class="btn-action" onclick="input('(')">(</button>
            <button class="btn-action" onclick="input(')')">)</button>
            <button class="btn-action" onclick="input('%')">%</button>
            <button class="btn-action" onclick="input('/')">÷</button>

            <!-- Numbers & Operators -->
            <button onclick="input('7')">7</button>
            <button onclick="input('8')">8</button>
            <button onclick="input('9')">9</button>
            <button class="btn-action" onclick="input('*')">×</button>
            <button class="scientific" onclick="inputFunc('fact(')">x!</button>
            <button class="scientific" onclick="input('1/')">1/x</button>

            <button onclick="input('4')">4</button>
            <button onclick="input('5')">5</button>
            <button onclick="input('6')">6</button>
            <button class="btn-action" onclick="input('-')">-</button>
            <button class="scientific" onclick="input('^2')">x²</button>
            <button class="scientific" id="ans-btn" onclick="useAns()">Ans</button>

            <button onclick="input('1')">1</button>
            <button onclick="input('2')">2</button>
            <button onclick="input('3')">3</button>
            <button class="btn-action" onclick="input('+')">+</button>
            <button onclick="input('0')" style="grid-column: span 2;">0</button>

            <button onclick="input('.')">.</button>
            <button class="btn-equals" onclick="calculate()" style="grid-column: span 3;">=</button>
        </div>
    </div>

    <!-- History Sidebar -->
    <div class="history-sidebar">
        <div class="history-header">
            <h3>History</h3>
            <button class="toggle-btn" onclick="clearHistory()">Clear</button>
        </div>
        <div class="history-list" id="history-items"></div>
    </div>
</div>

<!-- All JavaScript code embedded safely inside the HTML file -->
<script>
    let currentInput = "";
    let isDegMode = true;
    let lastAnswer = "0";

    const exprDisplay = document.getElementById("expression-display");
    const resDisplay = document.getElementById("result-display");
    const angleIndicator = document.getElementById("angle-indicator");
    const historyItems = document.getElementById("history-items");

    document.getElementById("theme-toggle").addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const targetTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", targetTheme);
    });

    document.getElementById("mode-toggle").addEventListener("click", (e) => {
        isDegMode = !isDegMode;
        e.target.innerText = isDegMode ? "DEG" : "RAD";
        angleIndicator.innerText = isDegMode ? "Degrees" : "Radians";
    });

    function input(value) {
        currentInput += value;
        updateDisplay();
    }

    function inputFunc(funcName) {
        currentInput += funcName;
        updateDisplay();
    }

    function useAns() {
        currentInput += lastAnswer;
        updateDisplay();
    }

    function clearAll() {
        currentInput = "";
        resDisplay.innerText = "0";
        updateDisplay();
    }

    function backspace() {
        currentInput = currentInput.slice(0, -1);
        updateDisplay();
    }

    function updateDisplay() {
        let displayStr = currentInput
            .replace(/\*/g, "×")
            .replace(/\//g, "÷")
            .replace(/sqrt/g, "√")
            .replace(/asin/g, "sin⁻¹")
            .replace(/acos/g, "cos⁻¹")
            .replace(/atan/g, "tan⁻¹");
        exprDisplay.innerText = displayStr;
    }

    function fact(n) {
        if (n < 0) return NaN;
        if (n === 0 || n === 1) return 1;
        let result = 1;
        for (let i = 2; i <= n; i++) result *= i;
        return result;
    }

    function calculate() {
        if (!currentInput) return;
        
        let parseExpression = currentInput;

        parseExpression = parseExpression.replace(/π/g, "Math.PI").replace(/e/g, "Math.E");
        parseExpression = parseExpression.replace(/\^2/g, "**2");
        parseExpression = parseExpression.replace(/\^/g, "**");
        parseExpression = parseExpression.replace(/sqrt\(/g, "Math.sqrt(");
        parseExpression = parseExpression.replace(/log\(/g, "Math.log10(");
        parseExpression = parseExpression.replace(/ln\(/g, "Math.log(");

        const degToRadFactor = isDegMode ? "(Math.PI / 180)" : "1";
        const radToDegFactor = isDegMode ? "(180 / Math.PI)" : "1";

        parseExpression = parseExpression.replace(/sin\(/g, `Math.sin(${degToRadFactor} * `);
        parseExpression = parseExpression.replace(/cos\(/g, `Math.cos(${degToRadFactor} * `);
        parseExpression = parseExpression.replace(/tan\(/g, `Math.tan(${degToRadFactor} * `);

        parseExpression = parseExpression.replace(/asin\(/g, `(${radToDegFactor} * Math.asin(`);
        parseExpression = parseExpression.replace(/acos\(/g, `(${radToDegFactor} * Math.acos(`);
        parseExpression = parseExpression.replace(/atan\(/g, `(${radToDegFactor} * Math.atan(`);

        try {
            let finalResult = eval(parseExpression);
            
            if (typeof finalResult === 'number' && !isNaN(finalResult)) {
                if (finalResult % 1 !== 0) {
                    finalResult = parseFloat(finalResult.toFixed(10));
                }
            } else {
                throw new Error("Invalid Output");
            }

            resDisplay.innerText = finalResult;
            addToHistory(exprDisplay.innerText, finalResult);
            lastAnswer = finalResult.toString();
            currentInput = finalResult.toString(); 
        } catch (error) {
            resDisplay.innerText = "Error";
        }
    }

    function addToHistory(expr, res) {
        const item = document.createElement("div");
        item.className = "history-item";
        item.innerHTML = `
            <div class="history-expr">${expr}</div>
            <div class="history-res">${res}</div>
        `;
        item.onclick = () => {
            currentInput = res.toString();
            updateDisplay();
            resDisplay.innerText = res;
        };
        historyItems.prepend(item);
    }

    function clearHistory() {
        historyItems.innerHTML = "";
    }

    document.addEventListener("keydown", (e) => {
        if (e.key >= "0" && e.key <= "9") input(e.key);
        if (e.key === ".") input(".");
        if (e.key === "+") input("+");
        if (e.key === "-") input("-");
        if (e.key === "*") input("*");
        if (e.key === "/") input("/");
        if (e.key === "%") input("%");
        if (e.key === "(") input("(");
        if (e.key === ")") input(")");
        if (e.key === "Enter" || e.key === "=") calculate();
        if (e.key === "Backspace") backspace();
        if (e.key === "Escape") clearAll();
    });
</script>
</body>
</html>
