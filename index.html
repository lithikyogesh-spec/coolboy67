<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcy++ Scientific Calculator</title>
    <style>
        /* --- CSS VARIABLES & THEMING --- */
        :root {
            /* Dark Theme (Default) */
            --bg-app: linear-gradient(135deg, #120e2e 0%, #1e1136 100%);
            --bg-calc: #16172e;
            --bg-display: #090a14;
            --text-main: #ffffff;
            --text-muted: #747a9e;
            --bg-btn: #1f2244;
            --bg-btn-hover: #292d5a;
            --bg-btn-op: #2c255e;
            --bg-btn-op-hover: #3b327d;
            --accent: #a374ff;
            --border: rgba(255, 255, 255, 0.05);
        }

        [data-theme="light"] {
            /* Light Theme */
            --bg-app: linear-gradient(135deg, #eef2f7 0%, #dbe2ef 100%);
            --bg-calc: #ffffff;
            --bg-display: #f1f4f9;
            --text-main: #111424;
            --text-muted: #64748b;
            --bg-btn: #f8fafc;
            --bg-btn-hover: #e2e8f0;
            --bg-btn-op: #e0e7ff;
            --bg-btn-op-hover: #c7d2fe;
            --accent: #6366f1;
            --border: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.2s ease, color 0.2s ease;
        }

        body {
            background: var(--bg-app);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- WRAPPER & CONTAINER --- */
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .calculator {
            background-color: var(--bg-calc);
            border-radius: 20px;
            padding: 24px;
            width: 460px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
        }

        /* --- HEADER & TOP CONTROLS --- */
        .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.4rem;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .badge-btn {
            background: var(--bg-btn);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }

        .badge-btn:hover {
            background: var(--bg-btn-hover);
        }

        /* --- DISPLAY SCREEN --- */
        .display {
            background-color: var(--bg-display);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: right;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            word-break: break-all;
            border: 1px solid var(--border);
        }

        .expression {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 8px;
            min-height: 1.5rem;
        }

        .current-value {
            color: var(--text-main);
            font-size: 2.2rem;
            font-weight: 600;
            line-height: 1;
        }

        /* --- BUTTONS GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        button.calc-btn {
            background-color: var(--bg-btn);
            color: var(--text-main);
            border: none;
            border-radius: 10px;
            padding: 16px 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            user-select: none;
        }

        button.calc-btn:hover {
            background-color: var(--bg-btn-hover);
        }

        button.op {
            background-color: var(--bg-btn-op);
            font-weight: 600;
        }

        button.op:hover {
            background-color: var(--bg-btn-op-hover);
        }

        button.equals {
            background-color: var(--accent);
            color: #ffffff;
            font-weight: 700;
        }

        button.equals:hover {
            filter: brightness(1.1);
        }

        /* --- SIDE HISTORY PANEL --- */
        .history-panel {
            background-color: var(--bg-calc);
            border-radius: 20px;
            padding: 24px;
            width: 280px;
            height: 575px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
        }

        .history-title {
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clear-history {
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding-right: 5px;
        }

        .history-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            text-align: right;
            cursor: pointer;
        }

        .history-item:hover .hist-expr {
            color: var(--accent);
        }

        .hist-expr {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .hist-res {
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* Scrollbar styles */
        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 4px;
        }

        /* Responsive sizing */
        @media (max-width: 800px) {
            .app-container { flex-direction: column; align-items: center; }
            .history-panel { width: 460px; height: 250px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- CALCULATOR -->
    <div class="calculator">
        <div class="calc-header">
            <div class="logo">Calcy++</div>
            <div class="controls">
                <button class="badge-btn" id="angleMode">DEG</button>
                <button class="badge-btn" id="themeToggle">☀️ Light</button>
            </div>
        </div>

        <div class="display">
            <div class="expression" id="exprDisplay"></div>
            <div class="current-value" id="mainDisplay">0</div>
        </div>

        <div class="grid">
            <!-- Row 1 -->
            <button class="calc-btn op" onclick="inputFunc('sin')">sin</button>
            <button class="calc-btn op" onclick="inputFunc('cos')">cos</button>
            <button class="calc-btn op" onclick="inputFunc('tan')">tan</button>
            <button class="calc-btn op" onclick="inputFunc('asin')">sin⁻¹</button>
            <button class="calc-btn op" onclick="inputFunc('acos')">cos⁻¹</button>
            <button class="calc-btn op" onclick="inputFunc('atan')">tan⁻¹</button>

            <!-- Row 2 -->
            <button class="calc-btn op" onclick="inputFunc('log')">log</button>
            <button class="calc-btn op" onclick="inputFunc('ln')">ln</button>
            <button class="calc-btn" onclick="inputSpec('π')">π</button>
            <button class="calc-btn" onclick="inputSpec('e')">e</button>
            <button class="calc-btn op" onclick="inputFunc('sqrt')">√</button>
            <button class="calc-btn op" onclick="inputOp('^')">xʸ</button>

            <!-- Row 3 -->
            <button class="calc-btn op" onclick="clearAll()">AC</button>
            <button class="calc-btn op" onclick="backspace()">⌫</button>
            <button class="calc-btn op" onclick="inputNum('(')">(</button>
            <button class="calc-btn op" onclick="inputNum(')')">)</button>
            <button class="calc-btn op" onclick="inputOp('%')">%</button>
            <button class="calc-btn op" onclick="inputOp('/')">÷</button>

            <!-- Row 4 -->
            <button class="calc-btn" onclick="inputNum('7')">7</button>
            <button class="calc-btn" onclick="inputNum('8')">8</button>
            <button class="calc-btn" onclick="inputNum('9')">9</button>
            <button class="calc-btn op" onclick="inputOp('*')">×</button>
            <button class="calc-btn op" onclick="inputFunc('abs')">abs</button>
            <button class="calc-btn op" onclick="inputOp('-')">-</button>

            <!-- Row 5 -->
            <button class="calc-btn" onclick="inputNum('4')">4</button>
            <button class="calc-btn" onclick="inputNum('5')">5</button>
            <button class="calc-btn" onclick="inputNum('6')">6</button>
            <button class="calc-btn op" onclick="inputOp('+')">+</button>
            <button class="calc-btn op" onclick="inputFunc('fact')">n!</button>
            <button class="calc-btn equals" style="grid-row: span 2; height: 100%;" onclick="calculate()">=</button>

            <!-- Row 6 -->
            <button class="calc-btn" onclick="inputNum('1')">1</button>
            <script src="js/script.js"></script>
